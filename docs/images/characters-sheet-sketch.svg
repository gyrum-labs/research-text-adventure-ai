    <text x="400" y="336" font-size="12" font-style="italic">Hotfix - the SLA expires at 17:00</text>
  </g>
  <g stroke="#2b3440" fill="none" stroke-width="1.6">
    <circle cx="466" cy="122" r="13"/>
    <line x1="460" y1="118" x2="472" y2="118"/>
    <circle cx="463" cy="124" r="1.4" fill="#2b3440" stroke="none"/>
    <circle cx="469" cy="124" r="1.4" fill="#2b3440" stroke="none"/>
  </g>

  <!-- 3. the agent -->
  <g stroke="#2b3440" fill="none" stroke-width="2.2" stroke-linecap="round">
    <rect x="600" y="140" width="86" height="74" rx="10"/>
    <circle cx="643" cy="172" r="15" stroke-width="2.4"/>
    <circle cx="643" cy="172" r="5" fill="#2b3440" stroke="none"/>
    <path d="M608 156 L616 164 M678 156 L670 164" stroke-width="1.6"/>
    <path d="M612 214 L676 214 L668 246 L620 246 Z"/>
    <path d="M622 224 L666 224 M624 232 L664 232 M626 240 L662 240" stroke-width="1.2"/>
    <path d="M596 246 L692 246 L692 300 L596 300 Z" stroke-width="1.8"/>
    <rect x="606" y="256" width="76" height="16" stroke-width="1.6"/>
    <path d="M612 262 L664 262 M612 268 L652 268" stroke-width="1"/>
    <path d="M604 300 L604 312 M688 300 L688 312" stroke-width="2"/>
