    <text x="644" y="336" font-size="12" font-style="italic">plays the same commands</text>
  </g>
  <g stroke="#2b3440" fill="none" stroke-width="1.6">
    <rect x="712" y="150" width="52" height="34" rx="4"/>
    <path d="M716 170 L728 158 L742 168 L760 156" stroke-width="1.8"/>
    <circle cx="760" cy="156" r="2.4" fill="#2b3440" stroke="none"/>
  </g>

  <!-- 4. the puzzle architect -->
  <g stroke="#2b3440" fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="824" cy="132" r="18"/>
    <path d="M814 116 C 820 108 830 108 836 116" stroke-width="1.6"/>
    <path d="M806 150 C 796 168 798 190 808 202 L842 202 C 852 186 850 164 840 150 Z" fill="url(#inkhatch)"/>
    <path d="M760 196 L888 192 L892 250 L764 254 Z" stroke-width="1.8"/>
    <path d="M776 232 L806 230 L808 244 L778 246 Z" stroke-width="1.4"/>
    <path d="M816 210 L848 208 M816 220 L846 218" stroke-width="1.2"/>
    <path d="M784 226 L812 218 L816 226" stroke-width="1.4"/>
    <path d="M852 160 L876 138 L882 144 L858 166 Z" stroke-width="1.6"/>
    <path d="M876 138 L872 132 L878 134 Z" fill="#2b3440" stroke="none"/>
  </g>
  <g fill="#2b3440" font-size="15" text-anchor="middle">
    <text x="826" y="316">THE PUZZLE ARCHITECT</text>
    <text x="826" y="336" font-size="12" font-style="italic">draws the world</text>
  </g>
  <g stroke="#2b3440" fill="none" stroke-width="1.6">
    <circle cx="768" cy="128" r="13"/>
    <path d="M762 132 C 766 128 770 128 774 132" stroke-width="1.2"/>
    <circle cx="764" cy="124" r="1.4" fill="#2b3440" stroke="none"/>
    <circle cx="772" cy="124" r="1.4" fill="#2b3440" stroke="none"/>
  </g>
  <text x="460" y="392" font-size="13" fill="#6a7280" text-anchor="middle" font-style="italic">drawn from the two shipped adventures and the experiment series - the agent is a character too</text>
</svg>
