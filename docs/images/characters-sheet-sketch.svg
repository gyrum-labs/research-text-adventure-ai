<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <pattern id="inkhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2b3440" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="920" height="620" fill="#fdfcf9"/>
  <text x="460" y="44" font-size="24" text-anchor="middle" fill="#2b3440" font-weight="bold">the cast of the book</text>
  <line x1="80" y1="58" x2="840" y2="58" stroke="#2b3440" stroke-width="1.4"/>

  <!-- 1. field operative -->
  <g stroke="#2b3440" fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="150" cy="120" r="20"/>
    <path d="M138 104 C 130 96 152 90 160 102" stroke-width="1.6"/>
    <path d="M136 140 C 120 158 118 196 128 216 L172 216 C 184 192 180 156 164 140 Z" fill="url(#inkhatch)"/>
    <path d="M132 158 L112 206 M168 158 L190 202" stroke-width="2.4"/>
    <path d="M130 216 L124 288 M166 216 L176 288" stroke-width="2.6"/>
    <path d="M124 288 L114 288 M176 288 L188 288" stroke-width="3"/>
    <rect x="186" y="188" width="18" height="11" transform="rotate(-12 195 193)"/>
    <path d="M190 216 C 186 202 188 196 194 190" stroke-width="1.6"/>
  </g>
  <g fill="#2b3440" font-size="15" text-anchor="middle">
    <text x="152" y="316">FIELD OPERATIVE</text>
    <text x="152" y="336" font-size="12" font-style="italic">Nightingale - two goals, one keycard</text>
  </g>
  <!-- expression head -->
  <g stroke="#2b3440" fill="none" stroke-width="1.6">
    <circle cx="228" cy="118" r="13"/>
    <circle cx="223" cy="115" r="1.4" fill="#2b3440" stroke="none"/>
    <circle cx="233" cy="115" r="1.4" fill="#2b3440" stroke="none"/>
    <path d="M222 123 C 226 126 230 126 234 123"/>
  </g>

  <!-- 2. on-call engineer -->
  <g stroke="#2b3440" fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="400" cy="128" r="20"/>
    <path d="M380 124 C 376 104 424 104 420 124" stroke-width="1.6"/>
    <path d="M420 118 C 436 118 438 134 428 140" stroke-width="1.8"/>
    <circle cx="428" cy="142" r="4" stroke-width="1.4"/>
    <path d="M386 148 C 372 168 372 200 382 218 L420 218 C 430 198 428 164 414 148 Z" fill="url(#inkhatch)"/>
    <path d="M398 148 L390 166 L394 178" stroke-width="1.4"/>
    <rect x="382" y="170" width="9" height="26" stroke-width="1.4"/>
    <path d="M386 218 L380 290 M416 218 L424 290" stroke-width="2.6"/>
    <path d="M370 196 C 360 200 356 206 356 212" stroke-width="1.8"/>
