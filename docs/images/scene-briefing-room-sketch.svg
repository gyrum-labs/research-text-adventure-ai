<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <pattern id="lhatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(55)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#2b3440" stroke-width="0.9"/>
    </pattern>
  </defs>
  <rect width="920" height="620" fill="#fbfaf6"/>
  <!-- the cone of lamp light -->
  <path d="M460 60 L200 470 L720 470 Z" fill="#20242b" opacity="0.05"/>
  <!-- hanging lamp -->
  <g stroke="#20242b" fill="none" stroke-width="2.4" stroke-linecap="round">
    <line x1="460" y1="40" x2="460" y2="96"/>
    <path d="M436 96 L484 96 L468 128 L452 128 Z" fill="#20242b"/>
    <circle cx="460" cy="134" r="6" fill="#e8d48a" stroke="#20242b" stroke-width="1.4"/>
  </g>
  <!-- bulletin board -->
  <g stroke="#20242b" fill="none" stroke-width="2.4">
    <rect x="300" y="210" width="320" height="180" rx="4" fill="#f2e9d4"/>
    <line x1="300" y1="210" x2="300" y2="390" stroke-width="5"/>
    <line x1="620" y1="210" x2="620" y2="390" stroke-width="5"/>
    <line x1="300" y1="212" x2="620" y2="212" stroke-width="1"/>
    <!-- pinned papers -->
    <g transform="rotate(-4 360 260)">
      <rect x="330" y="234" width="60" height="76" fill="#ffffff" stroke-width="1.6"/>
      <line x1="338" y1="252" x2="384" y2="252" stroke-width="1.2"/>
      <line x1="338" y1="266" x2="380" y2="266" stroke-width="1.2"/>
      <line x1="338" y1="280" x2="384" y2="280" stroke-width="1.2"/>
      <circle cx="360" cy="234" r="3.4" fill="#b3261e" stroke="none"/>
    </g>
    <g transform="rotate(5 470 268)">
      <rect x="428" y="244" width="86" height="64" fill="#ffffff" stroke-width="1.6"/>
      <!-- the case photo, crossed out -->
      <rect x="450" y="258" width="42" height="32" rx="3" stroke-width="1.6"/>
      <line x1="446" y1="256" x2="498" y2="294" stroke="#b3261e" stroke-width="3"/>
      <line x1="498" y1="256" x2="446" y2="294" stroke="#b3261e" stroke-width="3"/>
      <circle cx="470" cy="244" r="3.4" fill="#b3261e" stroke="none"/>
    </g>
    <g transform="rotate(-7 560 262)">
      <rect x="534" y="238" width="54" height="66" fill="#ffffff" stroke-width="1.6"/>
      <path d="M542 262 C 552 256 562 268 572 260" stroke-width="1.4"/>
      <path d="M542 276 C 552 270 562 282 572 274" stroke-width="1.4"/>
      <circle cx="560" cy="238" r="3.4" fill="#b3261e" stroke="none"/>
    </g>
  </g>
  <!-- desk -->
  <g stroke="#20242b" fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M250 470 L670 470" stroke-width="4"/>
    <line x1="266" y1="470" x2="266" y2="540" stroke-width="3"/>
    <line x1="654" y1="470" x2="654" y2="540" stroke-width="3"/>
    <rect x="520" y="446" width="30" height="18"/>
    <path d="M524 446 L548 446" stroke-width="1"/>
    <text x="535" y="460" font-size="9" fill="#20242b" stroke="none" text-anchor="middle">KEYCARD</text>
  </g>
  <!-- the operative, reading, seen from behind -->
  <g stroke="#20242b" fill="none" stroke-width="2.6" stroke-linecap="round">
    <circle cx="430" cy="330" r="24"/>
    <path d="M414 316 C 422 306 440 306 448 318" stroke-width="1.8"/>
    <path d="M404 354 C 380 376 372 420 384 470 L476 470 C 490 418 482 372 456 354 Z" fill="url(#lhatch)"/>
    <path d="M404 380 L376 440" stroke-width="2.2"/>
  </g>
  <text x="672" y="330" font-size="15" fill="#20242b" font-style="italic">the brief pins two goals:</text>
  <text x="672" y="352" font-size="15" fill="#b3261e" font-style="italic">disarm, recover</text>
  <text x="672" y="374" font-size="15" fill="#20242b" font-style="italic">nothing else is known.</text>
  <text x="460" y="586" font-size="14" fill="#6a7280" text-anchor="middle" font-style="italic">Operation Nightingale, turn one: discover the rest by exploring</text>
</svg>
