<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <rect width="920" height="620" fill="#fdfcf9"/>
  <text x="460" y="42" font-size="22" text-anchor="middle" fill="#2b3440" font-weight="bold">experiment 02 - the world is bigger than what the agent sees</text>
  <!-- left: the full world -->
  <g stroke="#2b3440" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M90 110 L206 106 L210 172 L94 176 Z"/>
    <path d="M240 90 L352 86 L356 150 L244 154 Z"/>
    <path d="M262 190 L378 186 L382 252 L266 256 Z"/>
    <path d="M104 220 L220 216 L224 282 L108 286 Z"/>
    <path d="M330 296 L446 292 L450 358 L334 362 Z"/>
    <path d="M128 330 L244 326 L248 392 L132 396 Z"/>
    <line x1="210" y1="140" x2="240" y2="122" stroke-width="1.8"/>
    <line x1="240" y1="150" x2="264" y2="210" stroke-width="1.8"/>
    <line x1="220" y1="248" x2="262" y2="224" stroke-width="1.8"/>
    <line x1="226" y1="326" x2="330" y2="322" stroke-width="1.8"/>
    <line x1="356" y1="252" x2="336" y2="294" stroke-width="1.8"/>
  </g>
  <!-- tiny props -->
  <g stroke="#2b3440" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="128" y="136" width="22" height="16"/>
    <path d="M128 136 L150 136" stroke-width="1"/>
    <path d="M320 216 L334 204 L348 216 Z"/>
    <path d="M337 208 L337 200 M337 200 C 333 202 341 202 337 196" stroke-width="1.2"/>
    <rect x="330" y="316" width="24" height="14" rx="2"/>
    <circle cx="360" cy="322" r="7"/>
  </g>
  <text x="160" y="430" font-size="15" fill="#2b3440" text-anchor="middle" font-style="italic">the world: rooms, props, doors</text>
  <!-- magnifying lens with an eye -->
  <g stroke="#2b3440" fill="none" stroke-width="2.6" stroke-linecap="round">
    <circle cx="470" cy="300" r="64" stroke-width="3"/>
    <circle cx="470" cy="300" r="48" stroke-width="1.4"/>
    <path d="M522 352 L588 418" stroke-width="7"/>
    <path d="M446 296 C 456 286 484 286 494 296 C 484 308 456 308 446 296 Z" fill="#ffffff" stroke-width="1.8"/>
    <circle cx="470" cy="297" r="8" stroke-width="1.6"/>
    <circle cx="470" cy="297" r="2.6" fill="#2b3440" stroke="none"/>
  </g>
  <!-- dashed sight lines from world to lens -->
  <g stroke="#6a7280" stroke-width="1.4" stroke-dasharray="6 6">
    <line x1="210" y1="172" x2="424" y2="266"/>
    <line x1="382" y1="252" x2="430" y2="284"/>
  </g>
  <!-- right: the terminal window -->
  <g stroke="#2b3440" fill="none" stroke-width="2.6" stroke-linecap="round">
    <rect x="640" y="220" width="220" height="180" rx="8"/>
    <rect x="640" y="220" width="220" height="30" rx="8"/>
    <line x1="640" y1="250" x2="860" y2="250" stroke-width="1.6"/>
    <circle cx="656" cy="235" r="4" stroke-width="1.2"/>
    <circle cx="672" cy="235" r="4" stroke-width="1.2"/>
  </g>
  <g fill="#2b3440" font-size="15">
    <text x="656" y="286">Vault</text>
    <text x="656" y="316">You see: bomb</text>
    <text x="656" y="346">Exits: south</text>
  </g>
  <text x="750" y="430" font-size="15" fill="#2b3440" text-anchor="middle" font-style="italic">the agent: three lines at a time</text>
  <!-- the gap -->
  <g stroke="#b3261e" fill="none" stroke-width="2.4">
    <path d="M520 330 C 560 372 596 396 632 408" stroke-dasharray="none"/>
    <path d="M626 400 L632 408 L622 410"/>
  </g>
  <text x="500" y="480" font-size="18" fill="#b3261e" text-anchor="middle" font-weight="bold" transform="rotate(-3 500 480)">the gap</text>
  <text x="460" y="586" font-size="14" fill="#6a7280" text-anchor="middle" font-style="italic">everything the experiment proves lives inside that gap</text>
</svg>
