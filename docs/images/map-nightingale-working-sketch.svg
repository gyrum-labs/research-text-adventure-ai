<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#faf7ee"/>
  <text x="480" y="44" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle">Operation Nightingale - the player's map</text>

  <!-- rooms -->
  <g stroke="#1a1a1a" fill="#e2e3e5" stroke-width="2">
    <rect x="110" y="110" width="220" height="84"/>
    <rect x="410" y="312" width="220" height="84"/>
    <rect x="640" y="110" width="220" height="84" fill="#f8d7da" stroke="#dc3545"/>
  </g>
  <g fill="#1a1a1a" font-size="15" font-weight="600" text-anchor="middle">
    <text x="220" y="158">BRIEFING ROOM</text>
    <text x="520" y="360">SERVICE CORRIDOR</text>
    <text x="750" y="158">SERVER VAULT</text>
  </g>

  <!-- connections -->
  <g stroke="#1a1a1a" fill="none" stroke-width="2">
    <path d="M286 194 L434 312" marker-end="url(#arr)"/>
    <path d="M440 330 L292 212" marker-end="url(#arr)"/>
    <path d="M586 302 L662 198" marker-end="url(#arr)" stroke="#28a745"/>
    <path d="M668 204 L590 308" marker-end="url(#arr)" stroke="#28a745"/>
  </g>
  <g fill="#1a1a1a" font-size="13">
    <text x="346" y="248">S</text>
    <text x="368" y="232">N</text>
    <text x="608" y="248">N</text>
    <text x="616" y="272">S</text>
  </g>
  <g stroke="#dc3545" fill="none" stroke-width="2">
    <line x1="606" y1="240" x2="642" y2="252"/>
  </g>
  <text x="560" y="266" font-size="12" fill="#dc3545" font-style="italic">vault door (locked)</text>

  <!-- room contents -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.4">
    <rect x="150" y="132" width="26" height="15" fill="#d4edda" stroke="#28a745"/>
    <circle cx="310" cy="150" r="7"/>
    <rect x="450" y="330" width="20" height="30"/>
    <rect x="490" y="336" width="14" height="20" rx="5"/>
    <rect x="680" y="130" width="70" height="18"/>
    <circle cx="790" cy="150" r="10"/>
    <rect x="700" y="156" width="60" height="14"/>
  </g>
  <g fill="#5a6069" font-size="11" text-anchor="middle">
    <text x="163" y="162">keycard</text>
    <text x="310" y="172">bulletin</text>
    <text x="460" y="374">locker</text>
    <text x="497" y="370">exting.</text>
    <text x="715" y="162">the case</text>
    <text x="790" y="174">bomb</text>
    <text x="730" y="182">wires</text>
  </g>

  <!-- player notes panel -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.4">
    <rect x="640" y="300" width="264" height="220" rx="6" fill="#ffffff"/>
    <line x1="640" y1="330" x2="904" y2="330" stroke-width="1.2"/>
  </g>
  <text x="656" y="322" font-size="13" font-weight="600" fill="#1a1a1a">player notes</text>
  <g fill="#1a1a1a" font-size="13">
    <text x="656" y="354">1. take keycard (briefing room)</text>
    <text x="656" y="378">2. go corridor - read the manual:</text>
    <text x="668" y="398">safe code 4821, yellow wire</text>
    <text x="656" y="422">3. open locker - take cutters</text>
    <text x="656" y="446">4. unlock vault door with keycard</text>
    <text x="656" y="470">5. cut yellow wire, open safe (4821)</text>
    <text x="656" y="494">6. take case - both goals done</text>
  </g>

  <!-- goals: success green -->
  <g stroke="#28a745" fill="#d4edda" stroke-width="2">
    <rect x="120" y="470" width="150" height="52" rx="26"/>
    <rect x="310" y="470" width="150" height="52" rx="26"/>
  </g>
  <g fill="#1a1a1a" font-size="17" font-weight="600" text-anchor="middle">
    <text x="195" y="502">DISARM</text>
    <text x="385" y="502">RECOVER</text>
  </g>
  <text x="120" y="560" font-size="13" fill="#5a6069" font-style="italic">gold path: 10 commands - the only route the world ships</text>
  <text x="120" y="584" font-size="13" fill="#5a6069" font-style="italic">3 rooms - 14 objects - 4 doors - 19 verbs</text>
</svg>
