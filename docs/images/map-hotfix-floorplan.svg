    <path d="M340 82 L340 262" stroke-width="5"/>
    <path d="M340 338 L340 519" stroke-width="5"/>
    <path d="M340 262 A76 76 0 0 1 416 338" stroke-width="1.6"/>
    <path d="M580 82 L580 250" stroke-width="5"/>
