    <text x="460" y="212" font-size="17">RELEASE</text>
    <text x="460" y="234" font-size="17">ENGINEERING</text>
    <text x="722" y="230" font-size="17">CUSTOMER</text>
    <text x="722" y="252" font-size="17">SUCCESS</text>
    <text x="150" y="497" font-size="13">incident ticket open</text>
