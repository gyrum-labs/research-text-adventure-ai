    <line x1="498" y1="298" x2="574" y2="298" stroke-width="2.4"/>
    <line x1="502" y1="298" x2="502" y2="314" stroke-width="2"/>
    <line x1="570" y1="298" x2="570" y2="314" stroke-width="2"/>
  </g>
  <!-- customer success furniture -->
  <g stroke="#20242b" fill="none" stroke-width="2">
    <rect x="620" y="100" width="110" height="30" fill="url(#hatch2)"/>
    <rect x="700" y="420" width="70" height="42"/>
    <rect x="716" y="404" width="26" height="18" rx="6"/>
    <line x1="724" y1="422" x2="724" y2="404" stroke-width="1.2"/>
  </g>
  <text x="290" y="186" font-size="13" fill="#20242b" text-anchor="middle">the SLA clock: 17:00</text>
