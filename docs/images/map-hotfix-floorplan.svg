<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3a3f47" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="920" height="600" fill="#fdfcf7"/>
  <g stroke="#20242b" fill="none" stroke-linecap="round">
