    <rect x="368" y="96" width="150" height="26"/>
    <text x="380" y="114" font-size="11" fill="#20242b" stroke="none">2.3.9</text>
    <text x="424" y="114" font-size="11" fill="#20242b" stroke="none">2.4.0</text>
    <text x="468" y="114" font-size="11" fill="#20242b" stroke="none">2.4.1</text>
    <line x1="404" y1="96" x2="404" y2="122" stroke-width="1"/>
