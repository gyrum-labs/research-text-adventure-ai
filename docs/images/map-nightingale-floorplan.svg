<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3a3f47" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="920" height="600" fill="#fdfcf7"/>
  <g stroke="#20242b" fill="none" stroke-linecap="round">
    <!-- outer walls -->
    <path d="M60 82 L59 519 L861 521 L860 81 L60 82" stroke-width="7"/>
    <!-- wall briefing / corridor with door gap -->
    <path d="M340 82 L340 288" stroke-width="5"/>
    <path d="M340 348 L340 519" stroke-width="5"/>
    <path d="M340 288 A60 60 0 0 1 400 348" stroke-width="1.6"/>
    <line x1="340" y1="348" x2="400" y2="348" stroke-width="2.4"/>
    <!-- wall corridor / vault: locked door, bold double line -->
    <path d="M580 82 L580 262" stroke-width="5"/>
    <path d="M580 338 L580 519" stroke-width="5"/>
    <path d="M580 262 L580 338" stroke-width="9"/>
    <path d="M587 262 L587 338" stroke-width="2"/>
    <path d="M580 262 A76 76 0 0 0 504 338" stroke-width="1.6"/>
    <!-- keycard reader beside vault door -->
    <rect x="556" y="284" width="14" height="24" stroke-width="2"/>
    <circle cx="563" cy="292" r="2.4" fill="#20242b" stroke="none"/>
  </g>
  <!-- briefing room furniture -->
  <g stroke="#20242b" fill="none" stroke-width="2">
    <rect x="96" y="96" width="112" height="34" fill="url(#hatch)"/>
    <rect x="88" y="408" width="126" height="52"/>
    <line x1="88" y1="424" x2="214" y2="424" stroke-width="1.2"/>
    <rect x="176" y="430" width="26" height="15" stroke-width="2"/>
    <line x1="179" y1="430" x2="199" y2="445" stroke-width="1"/>
  </g>
  <!-- corridor furniture -->
  <g stroke="#20242b" fill="none" stroke-width="2">
    <rect x="362" y="104" width="42" height="118"/>
    <line x1="362" y1="118" x2="404" y2="118" stroke-width="1.2"/>
    <line x1="362" y1="204" x2="404" y2="204" stroke-width="1.2"/>
    <rect x="534" y="108" width="18" height="30" rx="6"/>
  </g>
  <!-- vault furniture -->
  <g stroke="#20242b" fill="none" stroke-width="2">
    <rect x="604" y="96" width="30" height="150"/>
    <rect x="640" y="96" width="30" height="150"/>
    <rect x="676" y="96" width="30" height="150"/>
    <rect x="712" y="96" width="30" height="150"/>
    <rect x="748" y="96" width="30" height="150"/>
    <rect x="784" y="96" width="52" height="150"/>
    <circle cx="724" cy="330" r="16"/>
    <rect x="716" y="276" width="16" height="30"/>
    <rect x="700" y="252" width="48" height="26"/>
    <circle cx="800" cy="330" r="27"/>
    <path d="M800 312 C 792 322 792 338 800 348" stroke-width="1.6"/>
    <circle cx="800" cy="330" r="8"/>
    <path d="M778 322 L766 306 M778 338 L766 354" stroke-width="1.4"/>
  </g>
  <!-- labels -->
  <g fill="#20242b" font-size="21" text-anchor="middle">
    <text x="200" y="250">BRIEFING ROOM</text>
    <text x="460" y="212" font-size="17">SERVICE</text>
    <text x="460" y="236" font-size="17">CORRIDOR</text>
    <text x="724" y="452">SERVER VAULT</text>
    <text x="200" y="290" font-size="13">keycard on desk</text>
    <text x="460" y="430" font-size="13">locker + extinguisher</text>
  </g>
  <text x="452" y="270" font-size="13" fill="#20242b" text-anchor="middle">to briefing room</text>
  <text x="640" y="392" font-size="15" fill="#b3261e" font-weight="bold">VAULT DOOR - LOCKED</text>
  <text x="724" y="478" font-size="14" fill="#20242b" text-anchor="middle">the case, wired and waiting</text>
  <!-- title block, like a drawing sheet -->
  <g stroke="#20242b" fill="none" stroke-width="1.6">
    <rect x="596" y="536" width="264" height="50"/>
    <line x1="596" y1="556" x2="860" y2="556" stroke-width="1"/>
  </g>
  <g fill="#20242b" font-size="13">
    <text x="604" y="551">OPERATION NIGHTINGALE - bunker fit-out</text>
    <text x="604" y="576">scale: not to scale    rev A - 2026-11-16</text>
  </g>
</svg>
