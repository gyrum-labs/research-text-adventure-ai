<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6c757d" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>

  <!-- room fills -->
  <rect x="64" y="84" width="274" height="432" fill="#e2e3e5"/>
  <rect x="342" y="84" width="236" height="432" fill="#e9eaec"/>
  <rect x="582" y="84" width="276" height="432" fill="#f8d7da"/>

  <!-- walls -->
  <g stroke="#1a1a1a" fill="none" stroke-linecap="square">
    <rect x="60" y="80" width="800" height="440" stroke-width="7"/>
    <line x1="340" y1="80" x2="340" y2="290" stroke-width="4"/>
    <line x1="340" y1="345" x2="340" y2="520" stroke-width="4"/>
    <path d="M340 290 A55 55 0 0 1 395 345" stroke-width="1.2"/>
    <line x1="340" y1="345" x2="395" y2="345" stroke-width="2"/>
    <line x1="580" y1="80" x2="580" y2="264" stroke-width="4"/>
    <line x1="580" y1="336" x2="580" y2="520" stroke-width="4"/>
    <line x1="580" y1="264" x2="580" y2="336" stroke-width="8"/>
    <line x1="588" y1="264" x2="588" y2="336" stroke-width="1.6"/>
    <rect x="554" y="286" width="14" height="24" stroke-width="1.6"/>
    <circle cx="561" cy="294" r="2.2" fill="#dc3545" stroke="none"/>
  </g>

  <!-- briefing room -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.6">
    <rect x="100" y="96" width="112" height="30" fill="#fff3cd" stroke="#ffc107"/>
    <rect x="88" y="410" width="126" height="50"/>
    <line x1="88" y1="426" x2="214" y2="426" stroke-width="1"/>
    <rect x="170" y="432" width="26" height="15" fill="#d4edda" stroke="#28a745" stroke-width="1.4"/>
    <line x1="173" y1="432" x2="193" y2="447" stroke-width="0.8"/>
  </g>

  <!-- service corridor -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.6">
    <rect x="362" y="104" width="42" height="116"/>
    <line x1="362" y1="118" x2="404" y2="118" stroke-width="1"/>
    <line x1="362" y1="206" x2="404" y2="206" stroke-width="1"/>
    <rect x="534" y="108" width="18" height="30" rx="6"/>
  </g>

  <!-- server vault -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.6">
    <rect x="604" y="96" width="28" height="150"/>
    <rect x="640" y="96" width="28" height="150"/>
    <rect x="676" y="96" width="28" height="150"/>
    <rect x="712" y="96" width="28" height="150"/>
    <rect x="748" y="96" width="28" height="150"/>
    <rect x="784" y="96" width="52" height="150"/>
    <rect x="716" y="300" width="16" height="28"/>
    <rect x="702" y="276" width="48" height="24" fill="#f8d7da" stroke="#dc3545"/>
    <circle cx="802" cy="330" r="26"/>
    <circle cx="802" cy="330" r="8" stroke-width="1.2"/>
    <path d="M802 304 C 794 314 794 346 802 356" stroke-width="1.4"/>
  </g>

  <!-- labels -->
  <g fill="#1a1a1a" text-anchor="middle" font-size="15" letter-spacing="1">
    <text x="200" y="252">BRIEFING ROOM</text>
    <text x="460" y="222">SERVICE</text>
    <text x="460" y="242">CORRIDOR</text>
    <text x="720" y="458">SERVER VAULT</text>
  </g>
  <g fill="#5a6069" font-size="12" text-anchor="middle">
    <text x="200" y="274">keycard on desk</text>
    <text x="460" y="432">locker + extinguisher</text>
    <text x="724" y="480">the case, wired and waiting</text>
    <text x="452" y="262">to briefing room</text>
  </g>
  <text x="600" y="396" font-size="14" fill="#dc3545" font-weight="600">VAULT DOOR - LOCKED</text>

  <!-- title block -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.4">
    <rect x="596" y="536" width="264" height="50"/>
    <line x1="596" y1="556" x2="860" y2="556" stroke-width="1"/>
  </g>
  <g fill="#1a1a1a" font-size="12">
    <text x="606" y="551">OPERATION NIGHTINGALE - bunker fit-out</text>
    <text x="606" y="576">scale: not to scale&#160;&#160;&#160;&#160;rev A - 2026-11-16</text>
  </g>
</svg>
