<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="46" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle">experiment 03 - the agent plays</text>
  <text x="480" y="70" font-size="13" fill="#5a6069" text-anchor="middle" font-style="italic">a model can drive a state machine, given a clean loop and a fair error message</text>

  <!-- provider cloud -->
  <g stroke="#1a1a1a" fill="#e2e3e5" stroke-width="2">
    <path d="M400 90 C 380 60 440 48 470 62 C 495 44 550 52 556 78 C 590 74 606 100 586 118 L 410 118 C 396 112 394 100 400 90 Z"/>
  </g>
  <text x="480" y="92" font-size="13" fill="#1a1a1a" text-anchor="middle">the model</text>

  <!-- the agent at its terminal -->
  <g stroke="#1a1a1a" fill="none" stroke-width="2.2" stroke-linecap="round">
    <rect x="430" y="250" width="100" height="76" rx="12" fill="#e2e3e5"/>
    <circle cx="480" cy="286" r="17" stroke-width="2.6"/>
    <circle cx="480" cy="286" r="6" fill="#dc3545" stroke="none"/>
    <rect x="440" y="340" width="80" height="46" rx="4"/>
    <path d="M452 356 L510 356 M452 368 L500 368" stroke-width="1.2"/>
    <path d="M470 326 L470 340 M490 326 L490 340" stroke-width="2"/>
  </g>

  <!-- provider <-> agent link -->
  <path d="M480 118 L480 250" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M492 250 L492 118" stroke="#6c757d" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#a1)"/>
  <text x="504" y="180" font-size="12" fill="#5a6069">action proposal</text>
  <text x="504" y="228" font-size="12" fill="#5a6069">next observation</text>

  <!-- the clean loop -->
  <g stroke="#1a1a1a" fill="#f8f9fa" stroke-width="2">
    <rect x="120" y="300" width="180" height="56" rx="8"/>
    <rect x="120" y="390" width="180" height="56" rx="8"/>
  </g>
  <text x="210" y="324" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">clean loop</text>
  <text x="210" y="344" font-size="11" fill="#5a6069" text-anchor="middle">observation - action - repeat</text>
  <text x="210" y="414" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">fair error message</text>
  <text x="210" y="434" font-size="11" fill="#5a6069" text-anchor="middle">names the rule and the remedy</text>
  <path d="M300 340 C 360 330 396 330 436 340" stroke="#1a1a1a" fill="none" stroke-width="1.8" marker-end="url(#a1)"/>
  <path d="M430 396 C 370 420 320 424 302 414" stroke="#1a1a1a" fill="none" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- the world answers -->
  <g stroke="#28a745" fill="#d4edda" stroke-width="1.8">
    <rect x="620" y="300" width="240" height="60" rx="8"/>
  </g>
  <text x="740" y="326" font-size="13" fill="#1a1a1a" text-anchor="middle">the world moves</text>
  <text x="740" y="346" font-size="11" fill="#5a6069" text-anchor="middle">deterministic, replayable</text>
  <path d="M596 330 L616 330" stroke="#28a745" stroke-width="2" marker-end="url(#a1)"/>
  <g stroke="#dc3545" fill="#f8d7da" stroke-width="1.8">
    <rect x="620" y="390" width="240" height="60" rx="8"/>
  </g>
  <text x="740" y="416" font-size="13" fill="#1a1a1a" text-anchor="middle">the world refuses</text>
  <text x="740" y="436" font-size="11" fill="#5a6069" text-anchor="middle">nothing changed - the refusal teaches</text>
  <path d="M596 400 L616 402" stroke="#dc3545" stroke-width="2" marker-end="url(#a1)"/>

  <text x="480" y="560" font-size="14" fill="#5a6069" text-anchor="middle" font-style="italic">green moves and red refusals are both answers - the agent learns from either</text>
  <text x="480" y="586" font-size="14" fill="#28a745" text-anchor="middle" font-weight="600">live: the matrix has been run against real providers</text>
</svg>
