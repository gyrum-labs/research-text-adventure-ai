<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documentation</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header>
      <h1>Documentation</h1>
      <div class="search" role="search">
        <input
          id="search"
          type="search"
          placeholder="Search docs…"
          aria-label="Search documentation"
          autocomplete="off"
        />
        <select id="search-mode" aria-label="Search mode">
          <option value="filename">Filenames</option>
          <option value="fulltext">Full text</option>
        </select>
      </div>
      <span id="path" class="path" aria-live="polite"></span>
    </header>

    <div id="banner" class="banner" hidden></div>

    <div class="layout">
      <nav id="tree" aria-label="Documentation tree"></nav>
      <main id="content" tabindex="-1">
        <p class="placeholder">Select a file from the tree to view it.</p>
      </main>
    </div>

    <footer>
      Generated by
      <a href="https://github.com/gyrum-labs/devtools" rel="noopener">gyrum-labs/devtools</a>
      docs-viewer.
    </footer>

    <!--
      Library loading order matters: marked parses markdown, highlight.js styles
      code blocks the markdown produces, and mermaid renders the fenced diagrams
      highlight.js skipped. viewer.js depends on all three being present (or the
      fallback flag set), so the main script loads last and is not deferred.

      Versions are pinned intentionally. If you bump them, update the curl
      commands in README.md so the offline vendoring matches.
    -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
      if (typeof marked === "undefined") {
        document.write('<script src="lib/marked.min.js"><\/script>');
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <script>
      if (typeof hljs === "undefined") {
        document.write('<script src="lib/highlight.min.js"><\/script>');
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <script>
      if (typeof mermaid === "undefined") {
        document.write('<script src="lib/mermaid.min.js"><\/script>');
      }
    </script>
    <script src="viewer.js"></script>
  </body>
</html>
