# Vale config for the research-text-adventure-ai manuscript.
#
# The Microsoft style pack is the baseline: high signal, low false positive.
# It catches passive voice abuse, weak verbs, comma splices, repeated words
# and sentence-length outliers. The custom vocabulary whitelists this
# project's domain terms so they do not trip the spell and terms rules.
#
# Run: ./vale.sh              lint every prose file
#      ./vale.sh SPEC.md      lint one file
#
# The em-dash rule and the AI-tell list are not Vale's job. They live in
# scripts/check-style.py, which vale.sh runs first.

StylesPath = .vale/styles

# We ship our own vocab; tell Vale to read it.
Vocab = Research

# Warn-level severity by default; only block on errors during the
# pre-publish pass.
MinAlertLevel = warning

Packages = Microsoft

[*.md]
BasedOnStyles = Vale, Microsoft

# Disable rules that fight this project's intentional voice:
#
# FirstPerson  - the writing is a first-person operator's account; "I" is
#                 load-bearing, not noise.
# Contractions  - the prose mixes contractions and full forms on purpose.
# Avoid         - flags "backend", "frontend" and similar; standard here.
# We            - context dependent; both are used correctly.
# HeadingAcronyms - technical headings use acronyms routinely.
# HeadingColons - the manuscript uses colons in headings.
# Adverbs       - flags every adverb as suspicious; too aggressive.
# Quotes        - the source uses straight quotes so it pastes into a terminal.
# DateFormat    - the source uses YYYY-MM-DD intentionally.
# Dashes        - the em-dash rule is enforced by scripts/check-style.py.
# Headings      - typography rules live in the repository's own conventions.
# Foreign       - flags every italicised non-English word.
# Auto          - flags hyphenation; it is controlled deliberately.
# Hyphens       - same.
# Percentages   - number style; the source follows its own conventions.
# AMPM          - date and number style; same.
# HeadingPunctuation - covered by the em-dash rule.
# Vale.Terms    - the bundled term list does not fit this context.
# Vale.Spelling - the custom vocab covers the domain terms.
Microsoft.FirstPerson = NO
Microsoft.Contractions = NO
Microsoft.Avoid = NO
Microsoft.We = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingColons = NO
Microsoft.Adverbs = NO
Microsoft.Quotes = NO
Microsoft.DateFormat = NO
Microsoft.Dashes = NO
Microsoft.Headings = NO
Microsoft.Foreign = NO
Microsoft.Auto = NO
Microsoft.Hyphens = NO
Microsoft.Percentages = NO
Microsoft.AMPM = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Terms = NO
Vale.Terms = NO
Vale.Spelling = NO

# The bibliography quotes sources in their own wording, including author
# initials that the repetition rule reads as a mistake. Turn the rules off
# there rather than mangling a citation.
[docs/REFERENCES.md]
BasedOnStyles =
